<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PhysioLogger Protocol Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 14px) 14px env(safe-area-inset-bottom, 12px) 14px;
      overflow: hidden;
      transition: background-color 0.6s ease;
    }

    /* 上部ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px 4px 2px;
    }

    .app-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .total-time {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* プログレスバー */
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      margin: 6px 0 8px 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 3px;
      transition: width 0.3s linear, background-color 0.5s;
    }

    /* 年代セレクター（10歳階級）＆ オーディオ設定バー */
    .config-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }

    .age-selector {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 12px;
      justify-content: space-between;
    }

    .age-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 2px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .age-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .audio-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    .bgm-info {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
      font-weight: 600;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .bgm-toggle {
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .bgm-toggle.off {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* メイン表示エリア */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      padding: 4px 0;
    }

    .phase-badge {
      font-size: 16px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 30px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      transition: all 0.5s ease;
    }

    .phase-name {
      font-size: clamp(36px, 10vw, 62px);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: color 0.5s ease;
    }

    .phase-rpe {
      font-size: clamp(14px, 3.8vw, 19px);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 6px;
    }

    .phase-target-pill {
      font-size: 13px;
      font-weight: 700;
      color: #fde68a;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    .phase-timer {
      font-size: clamp(60px, 17vw, 102px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 12px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.6);
    }

    /* 次フェーズ予告カード (10秒前) */
    .next-banner {
      width: 100%;
      max-width: 440px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .next-banner.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .next-label {
      font-size: 12px;
      font-weight: 700;
      color: #f59e0b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .next-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .next-countdown-badge {
      font-size: 24px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.15);
      padding: 4px 12px;
      border-radius: 10px;
      min-width: 44px;
    }

    /* 5秒前カウントダウン巨大オーバーレイ */
    .countdown-overlay {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-size: clamp(130px, 38vw, 200px);
      font-weight: 900;
      color: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 0 0 50px rgba(255, 255, 255, 0.8), 0 0 100px rgba(245, 158, 11, 0.6);
      z-index: 50;
    }

    .countdown-overlay.pop {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* 下部コントローラー */
    footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      height: 52px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
    }

    .credit-line {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      line-height: 1.3;
    }

    .credit-line a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
    }

    /* フェーズ別テーマカラー */
    body.theme-rest { background-color: #0b1e3b; }
    body.theme-rest .phase-name { color: #60a5fa; }
    body.theme-rest .phase-badge { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    body.theme-rest .progress-bar { background: #3b82f6; }

    body.theme-walk { background-color: #062e24; }
    body.theme-walk .phase-name { color: #34d399; }
    body.theme-walk .phase-badge { background: rgba(16, 185, 129, 0.2); color: #a7f3d0; }
    body.theme-walk .progress-bar { background: #10b981; }

    body.theme-jog { background-color: #381a03; }
    body.theme-jog .phase-name { color: #fbbf24; }
    body.theme-jog .phase-badge { background: rgba(245, 158, 11, 0.2); color: #fde68a; }
    body.theme-jog .progress-bar { background: #f59e0b; }

    body.theme-sprint { background-color: #3b0d11; }
    body.theme-sprint .phase-name { color: #f87171; }
    body.theme-sprint .phase-badge { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }
    body.theme-sprint .progress-bar { background: #ef4444; }

    body.theme-active-rest { background-color: #1f2d08; }
    body.theme-active-rest .phase-name { color: #a3e635; }
    body.theme-active-rest .phase-badge { background: rgba(132, 204, 22, 0.2); color: #d9f99d; }
    body.theme-active-rest .progress-bar { background: #84cc16; }

    body.theme-final-rest { background-color: #161536; }
    body.theme-final-rest .phase-name { color: #818cf8; }
    body.theme-final-rest .phase-badge { background: rgba(99, 102, 241, 0.2); color: #c7d2fe; }
    body.theme-final-rest .progress-bar { background: #6366f1; }
  </style>
</head>
<body class="theme-rest">

  <div>
    <header>
      <div class="app-title">PhysioLogger ペーサー</div>
      <div class="total-time" id="totalTimeDisplay">経過 00:00 / 17:00</div>
    </header>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 10歳階級セレクター ＆ BGMコントロール -->
    <div class="config-bar">
      <div class="age-selector" id="ageSelector">
        <button class="age-btn" onclick="selectAge(25, this)">20代</button>
        <button class="age-btn" onclick="selectAge(35, this)">30代</button>
        <button class="age-btn" onclick="selectAge(45, this)">40代</button>
        <button class="age-btn" onclick="selectAge(55, this)">50代</button>
        <button class="age-btn" onclick="selectAge(65, this)">60代</button>
        <button class="age-btn active" onclick="selectAge(70, this)">70代(古稀)</button>
      </div>
      <div class="audio-bar">
        <div class="bgm-info" id="bgmTitleDisplay">🎵 BGM: Gymnopedie No. 1</div>
        <button class="bgm-toggle" id="bgmToggleBtn" onclick="toggleBGM()">BGM: ON</button>
      </div>
    </div>
  </div>

  <main>
    <div class="phase-badge" id="phaseBadge">1 / 6 フェーズ</div>
    <div class="phase-name" id="phaseName">座位安静</div>
    <div class="phase-rpe" id="phaseRpe">RPE 6〜7 (極めて楽 / ベースライン)</div>
    <div class="phase-target-pill" id="phaseTargetPill">目安HR: ~75 bpm | DFA α1 > 1.0</div>
    <div class="phase-timer" id="phaseTimer">03:00</div>

    <!-- 10秒前 予告バナー -->
    <div class="next-banner" id="nextBanner">
      <div style="text-align: left;">
        <div class="next-label">10秒後 次のアクション</div>
        <div class="next-title" id="nextTitle">2/6 その場歩き (RPE 9〜10)</div>
      </div>
      <div class="next-countdown-badge" id="nextCountdown">10</div>
    </div>

    <!-- 5秒前 巨大カウントダウン数字 -->
    <div class="countdown-overlay" id="countdownOverlay">5</div>
  </main>

  <footer>
    <div class="btn-row">
      <button class="btn btn-secondary" id="resetBtn" onclick="resetTimer()">リセット</button>
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">スタート</button>
    </div>
    <div class="credit-line">
      Music by Kevin MacLeod (<a href="https://incompetech.com" target="_blank">incompetech.com</a>) | CC BY 4.0
    </div>
  </footer>

  <!-- BGM Audio Element -->
  <audio id="bgmPlayer" loop preload="auto" crossorigin="anonymous"></audio>

  <script>
    // 年代別の運動ピッチ（歩/分 SPM）補正係数とTanaka式HRmax算出
    let currentAge = 70; // デフォルト: 70代（古稀）
    let bgmEnabled = true;

    // 17分検証プロトコルの定義（Incompetech CC BY 4.0 楽曲付き）
    const PROTOCOL = [
      {
        id: 1,
        name: "座位安静",
        duration: 180,
        rpe: "RPE 6〜7 (極めて楽 / ベースライン)",
        theme: "theme-rest",
        hrRatio: [0.40, 0.50],
        baseSpm: 0,
        alphaDesc: "α1 > 1.0",
        songTitle: "Gymnopedie No. 1",
        songUrl: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Gymnopedie%20No%201.mp3"
      },
      {
        id: 2,
        name: "その場歩き",
        duration: 180,
        rpe: "RPE 9〜10 (かなり楽 / 散歩ペース)",
        theme: "theme-walk",
        hrRatio: [0.55, 0.65],
        baseSpm: 100,
        alphaDesc: "α1 ≈ 0.90",
        songTitle: "Carefree",
        songUrl: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Carefree.mp3"
      },
      {
        id: 3,
        name: "その場小走り",
        duration: 180,
        rpe: "RPE 12〜13 (軽く弾むジョグ / LT1)",
        theme: "theme-jog",
        hrRatio: [0.70, 0.80],
        baseSpm: 135,
        alphaDesc: "α1 ≈ 0.75 (LT1)",
        songTitle: "Electro Cabello",
        songUrl: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Electro%20Cabello.mp3"
      },
      {
        id: 4,
        name: "ハイニー疾走",
        duration: 120,
        rpe: "RPE 15〜16 (腿上げダッシュ / LT2)",
        theme: "theme-sprint",
        hrRatio: [0.85, 0.95],
        baseSpm: 165,
        alphaDesc: "α1 ≈ 0.50 (LT2)",
        songTitle: "Movement Proposition",
        songUrl: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Movement%20Proposition.mp3"
      },
      {
        id: 5,
        name: "アクティブレスト",
        duration: 180,
        rpe: "RPE 8〜9 (ゆっくり歩き / 深呼吸)",
        theme: "theme-active-rest",
        hrRatio: [0.55, 0.65],
        baseSpm: 85,
        alphaDesc: "α1 回復上昇",
        songTitle: "Bossa Antigua",
        songUrl: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Bossa%20Antigua.mp3"
      },
      {
        id: 6,
        name: "座位回復",
        duration: 180,
        rpe: "RPE 6〜7 (静かに着席 / 回復)",
        theme: "theme-final-rest",
        hrRatio: [0.45, 0.55],
        baseSpm: 0,
        alphaDesc: "α1 > 1.0 復帰",
        songTitle: "Clean Soul",
        songUrl: "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Clean%20Soul.mp3"
      }
    ];

    const TOTAL_SECONDS = PROTOCOL.reduce((acc, p) => acc + p.duration, 0);

    let currentPhaseIndex = 0;
    let phaseSecondsRemaining = PROTOCOL[0].duration;
    let elapsedTotalSeconds = 0;
    let isRunning = false;
    let timerInterval = null;

    let audioCtx = null;
    const bgmPlayer = document.getElementById('bgmPlayer');

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function loadAndPlayPhaseBGM(phaseIndex) {
      const phase = PROTOCOL[phaseIndex];
      document.getElementById('bgmTitleDisplay').textContent = `🎵 BGM: ${phase.songTitle}`;
      if (bgmPlayer.src !== phase.songUrl) {
        bgmPlayer.src = phase.songUrl;
      }
      bgmPlayer.volume = 0.65;
      if (isRunning && bgmEnabled) {
        bgmPlayer.play().catch(e => console.log("BGM play blocked:", e));
      }
    }

    function toggleBGM() {
      bgmEnabled = !bgmEnabled;
      const btn = document.getElementById('bgmToggleBtn');
      if (bgmEnabled) {
        btn.textContent = "BGM: ON";
        btn.classList.remove('off');
        if (isRunning) {
          bgmPlayer.play().catch(e => console.log(e));
        }
      } else {
        btn.textContent = "BGM: OFF";
        btn.classList.add('off');
        bgmPlayer.pause();
      }
    }

    function selectAge(age, btnEl) {
      currentAge = age;
      document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      updateUI();
    }

    // Tanaka式 (208 - 0.7 * Age) による年代別目標心拍・ピッチ算出
    function getAgeAdjustedTargetText(phase) {
      const hrMax = Math.round(208 - 0.7 * currentAge);
      const hrLow = Math.round(hrMax * phase.hrRatio[0]);
      const hrHigh = Math.round(hrMax * phase.hrRatio[1]);

      if (phase.baseSpm === 0) {
        return `目安HR: ${hrLow}〜${hrHigh} bpm | 目標 ${phase.alphaDesc}`;
      } else {
        // 若年層ほど推奨ピッチ(歩/分)をわずかに高め、高齢層は安全域に調整
        const ageOffset = Math.round((45 - currentAge) * 0.35);
        const targetSpm = phase.baseSpm + ageOffset;
        return `目安HR: ${hrLow}〜${hrHigh} bpm | ピッチ: 約${targetSpm}歩/分 | ${phase.alphaDesc}`;
      }
    }

    function playBeepShort() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.45, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {
        console.error(e);
      }
    }

    function playBeepLong() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1760, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.55);
      } catch (e) {
        console.error(e);
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateUI() {
      const phase = PROTOCOL[currentPhaseIndex];
      document.body.className = phase.theme;

      document.getElementById('phaseBadge').textContent = `${phase.id} / ${PROTOCOL.length} フェーズ`;
      document.getElementById('phaseName').textContent = phase.name;
      document.getElementById('phaseRpe').textContent = phase.rpe;
      document.getElementById('phaseTargetPill').textContent = getAgeAdjustedTargetText(phase);
      document.getElementById('phaseTimer').textContent = formatTime(phaseSecondsRemaining);
      document.getElementById('bgmTitleDisplay').textContent = `🎵 BGM: ${phase.songTitle}`;

      document.getElementById('totalTimeDisplay').textContent = `経過 ${formatTime(elapsedTotalSeconds)} / ${formatTime(TOTAL_SECONDS)}`;
      const progressPercent = (elapsedTotalSeconds / TOTAL_SECONDS) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      const nextBanner = document.getElementById('nextBanner');
      const nextTitle = document.getElementById('nextTitle');
      const nextCountdown = document.getElementById('nextCountdown');
      const countdownOverlay = document.getElementById('countdownOverlay');

      // 10秒前予告 ＆ BGM自動ダッキング（時報を聞きやすくするためBGM音量を絞る）
      if (phaseSecondsRemaining <= 10 && currentPhaseIndex < PROTOCOL.length - 1) {
        const nextPhase = PROTOCOL[currentPhaseIndex + 1];
        nextTitle.textContent = `${nextPhase.id}/${PROTOCOL.length} ${nextPhase.name} (${nextPhase.rpe.split(' ')[0]})`;
        nextCountdown.textContent = phaseSecondsRemaining;
        nextBanner.classList.add('visible');
        if (phaseSecondsRemaining <= 5) {
          bgmPlayer.volume = 0.2; // カウントダウン中はBGMを20%に減衰
        } else {
          bgmPlayer.volume = 0.4;
        }
      } else {
        nextBanner.classList.remove('visible');
        bgmPlayer.volume = 0.65;
      }

      if (phaseSecondsRemaining <= 5 && phaseSecondsRemaining > 0 && currentPhaseIndex < PROTOCOL.length - 1) {
        countdownOverlay.textContent = phaseSecondsRemaining;
        countdownOverlay.classList.remove('pop');
        void countdownOverlay.offsetWidth;
        countdownOverlay.classList.add('pop');
      } else {
        countdownOverlay.classList.remove('pop');
      }
    }

    function tick() {
      if (phaseSecondsRemaining <= 0) {
        if (currentPhaseIndex < PROTOCOL.length - 1) {
          playBeepLong();
          currentPhaseIndex++;
          phaseSecondsRemaining = PROTOCOL[currentPhaseIndex].duration;
          loadAndPlayPhaseBGM(currentPhaseIndex);
        } else {
          playBeepLong();
          clearInterval(timerInterval);
          isRunning = false;
          bgmPlayer.pause();
          document.getElementById('startBtn').textContent = "完了！";
          document.getElementById('phaseName').textContent = "全セッション終了";
          document.getElementById('phaseRpe').textContent = "お疲れ様でした！RECを停止してください";
          return;
        }
      } else {
        if (currentPhaseIndex < PROTOCOL.length - 1) {
          if (phaseSecondsRemaining === 3 || phaseSecondsRemaining === 2 || phaseSecondsRemaining === 1) {
            playBeepShort();
          }
        }
        phaseSecondsRemaining--;
        elapsedTotalSeconds++;
      }

      updateUI();
    }

    function toggleTimer() {
      initAudio();
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        bgmPlayer.pause();
        document.getElementById('startBtn').textContent = "再開";
        document.getElementById('startBtn').className = "btn btn-primary";
      } else {
        isRunning = true;
        loadAndPlayPhaseBGM(currentPhaseIndex);
        document.getElementById('startBtn').textContent = "一時停止";
        document.getElementById('startBtn').className = "btn btn-secondary";
        timerInterval = setInterval(tick, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      bgmPlayer.pause();
      bgmPlayer.currentTime = 0;
      currentPhaseIndex = 0;
      phaseSecondsRemaining = PROTOCOL[0].duration;
      elapsedTotalSeconds = 0;
      document.getElementById('startBtn').textContent = "スタート";
      document.getElementById('startBtn').className = "btn btn-primary";
      updateUI();
    }

    updateUI();
  </script>
</body>
</html>
